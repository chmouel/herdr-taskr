[project]
name = "herdr-taskr"
version = "0.2.0"
description = "Interactive project task launcher for Herdr (Just, Make, Taskfile, npm/pnpm/yarn/bun, Cargo)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Chmouel Boudjnah" }]

[project.scripts]
herdr-taskr = "herdr_taskr.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
